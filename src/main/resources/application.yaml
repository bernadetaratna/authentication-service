
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authentication}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-expiration-ms: 900000
  refresh-token:
    expiration-ms: 604800000
  login-security:
    max-failed-attempts: 5
    window-minutes: 15
    lock-minutes: 15

server:
  servlet:
    context-path: /auth-service
  error:
    include-message: always